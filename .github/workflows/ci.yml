name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run: the queue no longer
# waits behind a superseded build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 shellcheck
      - name: Documentation links, anchors and version
        run: ./scripts/check-docs.sh
      - name: Shell scripts
        run: shellcheck install.sh scripts/*.sh tests/*.sh tests/lib/*.sh tests/e2e/*.sh tests/bench/*.sh tests/manual/*.sh

  test:
    runs-on: ubuntu-latest
    container: debian:12
    env:
      # Incremental artefacts are useless when the cache is restored as a
      # whole; disabling them makes the cached target smaller and faster.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential clang libclang-dev pkg-config curl ca-certificates
      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      # The release binary is built once, in the release workflow, where it is
      # actually published. Checking the release profile here catches
      # type/cfg errors without paying for the LTO link on every push.
      - name: Check release profile
        run: cargo check --release --locked -p e-lite
