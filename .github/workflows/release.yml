name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian artifacts
        run: ./scripts/package.sh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/e-lite_*_amd64.deb
            dist/e-lite_amd64.deb
            dist/e-lite-v*-x86_64-unknown-linux-gnu.tar.gz
            dist/e-lite_x86_64-unknown-linux-gnu.tar.gz
            dist/SHA256SUMS
            dist/install.sh
          generate_release_notes: true
