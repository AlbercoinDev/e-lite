[workspace]
resolver = "2"
members = [
    "crates/el-model",
    "crates/el-store",
    "crates/el-index",
    "crates/el-rpc",
    "crates/el-serve",
    "crates/el-rawtx",
    "crates/el-mempool",
    "crates/el-chain",
    "crates/el-blocks",
    "bin/e-lite",
]

[workspace.package]
version = "0.1.0-alpha.29.12.2"
edition = "2021"
license = "MIT"
rust-version = "1.85"
authors = ["AlbercoinDev"]

[workspace.dependencies]
bitcoin = "0.32"
rocksdb = "0.24"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }
rand = "0.8"
filetime = "0.2"
signal-hook = "0.3"
tar = "0.4"
flate2 = "1"
bip324 = "0.11"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
debug = 0
incremental = false
