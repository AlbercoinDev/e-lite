[workspace]
resolver = "2"
members = [
    "crates/el-model",
    "crates/el-store",
    "crates/el-index",
    "crates/el-rpc",
    "crates/el-serve",
    "bin/e-lite",
]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
license = "MIT"
rust-version = "1.85"
authors = ["AlbercoinDev"]

[workspace.dependencies]
bitcoin = "0.32"
rocksdb = "0.24"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
debug = 1
