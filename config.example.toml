# e-lite configuration (v0.2)
# Every value shown is the default unless stated otherwise.

[network]
name = "auto"                       # auto | mainnet | testnet4 | signet | regtest
# data_dir = "/home/USER/.local/share/e-lite"

[core]
manage = "auto"                     # external | auto | managed
bitcoind = "bitcoind"
core_datadir = "/home/USER/.bitcoin"
# blocks_dir = "/srv/core/blocks"   # only for -blocksdir or a custom layout
# rpc_url = "http://127.0.0.1:8332" # default port depends on the network
# rpc_user = ""                     # remote Core credentials
# rpc_password = ""
# cookie_file = ""                  # explicit cookie; overrides core_datadir
timeout_seconds = 30
prune_mib = 550                     # 550 = Core's maximum pruning; 0 = full node
extra_args = []                     # e.g. ["-dbcache=1024", "-fastprune"]
restart = true                      # restart a Core launched by e-lite
stop_on_exit = true                 # stop only a Core launched by e-lite
# log_file = ""                     # default <data-dir>/bitcoind.log

[index]
block_source = "auto"               # auto | rpc | files
readers = 0                         # 0 = auto from CPU count
cache_mib = 0                       # 0 = auto from RAM
reorg_window = 288                  # undo records kept for reorgs
batch_blocks = 256                  # blocks per atomic commit
follow = true                       # keep following the tip

[pruning]
min_free_gib = 10                   # pause Core + indexing below this
max_core_lag_blocks = 512           # capped by Core's retention window
poll_seconds = 10

[server]
listen = "127.0.0.1:50001"
max_clients = 32

[metrics]
enabled = true
listen = "127.0.0.1:9184"

[rawtx]
enabled = true
cache_mib = 2048                    # validated LRU cache; 0 disables
decoys = 3                          # extra blocks fetched per real fetch
tor_socks = "127.0.0.1:9050"        # empty requires allow_clearnet = true
allow_clearnet = false              # fail closed without Tor
use_p2p = true                      # minimal P2P client
use_esplora = true                  # Esplora-compatible block endpoints
p2p_v2 = true                       # BIP324 encrypted transport, fallback to v1
p2p_peers = []                      # empty: discover from local Core
# esplora_urls = []                 # empty: per-network defaults
#   mainnet: blockstream/mempool + onion
#   signet:  https://mempool.space/signet/api
#   testnet4:https://mempool.space/testnet4/api
#   regtest: none

[silent_payments]
enabled = false                     # opt-in gate; BIP352 indexer not included yet

[safety]
allow_mainnet = false               # mainnet requires explicit opt-in
