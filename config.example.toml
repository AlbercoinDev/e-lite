# e-lite configuration (v0.2)
# Every value shown is the default unless stated otherwise.
# Any field can be overridden without this file: see `e-lite --help` and
# docs/CLI.md (`--profile`, `--cache-mib`, `--set section.key=value`, ...).

[network]
name = "auto"                       # auto | mainnet | testnet4 | signet | regtest
# One self-contained folder per network: ~/e-lite/<network>.
# data_dir = "/home/USER/e-lite/mainnet"

[core]
manage = "auto"                     # external | auto | managed
bitcoind = "bitcoind"
# Core datadir. Empty = <data-dir>/bitcoin, so each network/instance has its
# own. A single legacy datadir (~/.bitcoin or ~/e-lite/bitcoin) is detected;
# with two candidates, set this explicitly.
# core_datadir = "/home/USER/e-lite/mainnet/bitcoin"
# blocks_dir = "/srv/core/blocks"   # only for -blocksdir or a custom layout
# rpc_url = "http://127.0.0.1:8332" # default port depends on the network
# rpc_user = ""                     # remote Core credentials
# rpc_password = ""
# cookie_file = ""                  # explicit cookie; overrides core_datadir
# require_loopback_rpc = false      # true: refuse a non-loopback rpc_url
#                                   # (Core RPC is HTTP; use SSH/VPN for LAN/WAN)
timeout_seconds = 30
prune_mib = 1                       # 1 = manual pruning (safe from zero); 0 = full node;
                                    # >=550 = automatic pruning, requires allow_auto_prune
extra_args = []                     # e.g. ["-dbcache=1024"]; e-lite adds a fitted
                                    # -dbcache/-par/-rpcthreads/-listenonion=0/-prune
                                    # unless you set them here. Core's own onion is
                                    # off because the managed Tor has no ControlPort;
                                    # set -listenonion=1 only with a working -torcontrol.
                                    # -datadir/-chain/-rpcport are rejected.
restart = true                      # restart a Core launched by e-lite
stop_on_exit = true                 # stop only a Core launched by e-lite
# io_priority = 7                   # opt-in best-effort ionice for managed Core (0-7)
# cgroup_io_weight = 100            # opt-in cgroup v2 io.weight (1-10000; needs delegation)
# log_file = ""                     # default <data-dir>/bitcoind.log

[index]
block_source = "auto"               # auto | rpc | files
readers = 0                         # 0 = machine plan (physical cores/disk) + adaptive
cache_mib = 0                       # 0 = auto from MemAvailable (SSD: 2 GiB at 8 GB,
                                    # 4 at 16, 8 at 32); >0 = hard maximum, still shrinks
reorg_window = 288                  # undo records kept for reorgs
batch_blocks = 256                  # 256 = auto/plan (512); explicit values are capped at 512
profile = "auto"                    # auto | hdd | ssd | nvme | manual
adaptive = true                     # event-driven readers/cache tuning
commit_sync = "auto"                # auto | always | txids (bulk durability tradeoff)
commit_interval_ms = 0              # 0 = plan: 20-60 s bulk by disk, 1.5 s live
prefetch_blocks = 0                 # prepared-block window cap; 0 = auto (workers*2)
prefetch_deadline_ms = 0            # stop prefetching a block after n ms (0 = off)
max_open_files = 0                  # 0 = 8192; 2048/4096 shrinks table readers on 8-16 GB
write_buffer_mib = 0                # total memtable budget; 0 = effective/16 (512 MB..2 GiB)
adaptive_memtables = false          # opt-in hot memtable resize (can force flushes)
memory_reserve_mib = 0              # RAM left for OS/Core/page cache; 0 = clamp(effective/8, 2-4 GiB)
memory_fraction = 0                 # hard ceiling over effective RAM; 0 = 0.75. Never
                                    # raised: cache+memtables+runtime always fit.
allow_low_memory = false            # skip the minimum-RAM check (unsupported;
                                    # mainnet needs an 8 GB class machine, others 4 GB)
background_jobs = 0                 # RocksDB jobs; 0 = plan (ssd/nvme: physical cores, 2..8; hdd: 2; virtual: 2..4)
milestone_blocks = 10000            # progress report every N blocks (0 = off)
milestone_seconds = 21600           # or every N seconds (0 = off; 6 h default)
follow = true                       # keep following the tip

[pruning]
min_free_gib = 10                   # pause Core downloads below this; indexing continues
critical_free_gib = 1               # also pause indexing below this hard floor (0 = never)
max_core_lag_blocks = 192           # automatic pruning only; hard-capped at 224
allow_auto_prune = false            # required for prune_mib >= 550; not for from-zero
max_bulk_lag_blocks = 20000         # legacy block growth window (used only if max_bulk_lag_gib = 0)
max_bulk_lag_gib = 30               # preferred: pause Core above this unindexed backlog
pause_core_during_bulk = true       # pause Core during a long catch-up
core_resume_ahead_blocks = 5000     # legacy resume margin (used only if core_resume_ahead_gib = 0)
core_resume_ahead_gib = 7           # resume Core when the backlog falls to this
scheduler = "overlap"               # overlap (e-lite indexes while Core downloads)
                                    # | alternate (take turns; opt-in, needs
                                    # prune_mib = 1 and
                                    # pause_core_during_bulk = true)
prune_defer_free_gib = 20           # keep 20 GiB free before normal pruning (low disk bypasses; once the index is caught up with a Core out of IBD, the deferral is bypassed so indexed blocks are released)
min_gain_blocks = 5000              # evaluate/execute prune every ~5k safe blocks
prune_interval_seconds = 30         # minimum time between prune requests (low disk bypasses)
repair_max_gap_blocks = 2048        # auto-repair a prune gap from verified sources
poll_seconds = 10

[server]
# Empty = 0.0.0.0:<network plain port>:
# mainnet 55011, testnet4 55111, signet 55211, regtest 55311.
listen = ""
# TLS is on by default. A local CA (ca.crt) plus a server certificate signed by
# it are generated on first start in <data-dir>/tls (SANs: localhost, 127.0.0.1,
# ::1, hostname, LAN IPs and the onion address once known). Trust ca.crt in the
# wallet. Set tls = false to disable it.
tls = true
# Empty = host of `listen` + the network TLS port:
# mainnet 55022, testnet4 55122, signet 55222, regtest 55322.
tls_listen = ""
# Empty = generated CA + server chain. Operator PEMs are never overwritten and
# keep working with a public-domain certificate.
# tls_cert = "/etc/e-lite/tls/fullchain.pem"
# tls_key = "/etc/e-lite/tls/privkey.pem"
# tls_auto_cert = true
max_clients = 32
# Per-client Electrum request budget. Same policy for every client; requests
# over the rate wait for the next token (they are not rejected). 0 disables it.
# rate_limit = 200                 # requests/second per client
# rate_burst = 5000                # initial burst tokens per client
# The certificate is validated against the hostname the client connects to, so
# a public-domain certificate only works when the wallet uses that name (use
# split-DNS for LAN access). A self-signed/internal CA certificate also works if
# the wallet trusts it. The PEM files are reloaded when they change on disk.
# Optional wallet banner template. Empty = built-in banners. If set and missing,
# e-lite creates it with [indexing]/[ready] sections and placeholders.
# banner_file = "banner.txt"

[tor]
# managed = e-lite runs its own Tor and publishes Electrum as an onion service.
# off     = no Tor, no onion (rawtx still uses [rawtx] tor_socks).
mode = "managed"
plain = true                        # publish the plain Electrum port
tls = true                          # publish the TLS Electrum port
tls_auto_cert = true                # deprecated: use [server] tls_auto_cert
onion_port = 0                      # 0 = same as the plain Electrum listener
onion_tls_port = 0                  # 0 = same as the TLS listener
socks_port = 0                      # managed Tor SOCKS; 0 = per-network (9050 mainnet,
                                    # 55150/55250/55350), then 9050, then 19050+
binary = ""                         # "" = installer bundle, then `tor` in PATH
start_timeout_seconds = 120
# data_dir = ""                     # default <data-dir>/tor
# target_plain = ""                 # default server.listen; 0.0.0.0 maps to 127.0.0.1
# target_tls = ""                   # default server.tls_listen; 0.0.0.0 maps to 127.0.0.1

[metrics]
enabled = true
# Empty = 127.0.0.1:<network metrics port>: mainnet 55084, testnet4 55184,
# signet 55284, regtest 55384. Each instance needs its own metrics port.
listen = ""

[rawtx]
enabled = true
cache_mib = 256                     # validated LRU cache; 0 disables
# cache_dir = "/dev/shm/e-lite-rawtx" # tmpfs keeps blocks off disk (counts as RAM)
decoys = 1                          # extra blocks fetched per real fetch (max 2 in flight)
tor_socks = "127.0.0.1:9050"        # empty requires allow_clearnet = true
allow_clearnet = false              # fail closed without Tor; also gates repair
tor_fallback_clearnet = true        # if Tor fails, use clearnet (IP exposed)
request_timeout_seconds = 8         # per Esplora block request
provider_cooldown_seconds = 300     # cool down a failed provider (Tor or direct)
max_parallel_fetches = 4            # total external block downloads in flight
p2p_timeout_seconds = 8             # P2P connect/handshake/block timeout
use_p2p = true                      # minimal P2P client; used for prune-gap repair
use_esplora = true                  # Esplora block endpoints; used for repair too
p2p_v2 = true                       # BIP324 encrypted transport, fallback to v1
p2p_peers = []                      # empty: discover from local Core
# esplora_urls = []                 # one-off override; normally leave empty and
#                                   # edit public-servers.toml instead (see below)

[public_servers]
# Public providers are NOT compiled into e-lite. The file is read from the same
# directory as this config file (or the path below). If it is missing on a first
# run, the shipped template is copied. If no template exists, e-lite uses local
# data only (fail closed).
# file = ""                         # empty = <config dir>/public-servers.toml
generate = true                     # create it from the template when missing
require_ready = true                # run: refuse wallets if no provider answers
probe_timeout_seconds = 5           # per-provider probe timeout
ready_timeout_seconds = 60          # wait for a provider before failing run

[silent_payments]
enabled = false                     # opt-in gate; BIP352 indexer not included yet

[logging]
# file = "/var/log/e-lite/e-lite.log"  # default <data-dir>/e-lite.log
max_mib = 16                        # rotate to e-lite.log.1 above this; 0 = never
# Verbosity of the extra diagnostic lines: `info` = standard lines only;
# `debug` = adds per-family/levels/statistics/I-O-pressure/controller detail;
# `trace` = adds one line per commit group. Alpha default: `debug`.
level = "debug"

[safety]
allow_mainnet = false               # mainnet requires explicit opt-in
